# =============================================================================
# NEUBAT - GRUB loopback (fallback USB/disco)
# Permite arrancar el ISO oficial de Arch almacenado en disco sin reescribir
# el medio: GRUB monta el ISO en loopback y carga su kernel.
#
# Uso: grub2> configfile /boot/grub/loopback.cfg
# o incluir como menuentry en grub.cfg del medio de arranque.
# =============================================================================

set iso_path="/boot/iso/archlinux-x86_64.iso"
set timeout=10
set default=neubat-production

menuentry "NEUBAT - Produccion (KDE)" --id neubat-production {
    set neubat_profile="production"
    loopback loop ${iso_path}
    linux (loop)/arch/boot/x86_64/vmlinuz-linux \
        img_dev=$imgdevpath img_loop=${iso_path} \
        archisobasedir=arch ip=dhcp neubat_profile=${neubat_profile}
    initrd (loop)/arch/boot/x86_64/initramfs-linux.img
}

menuentry "NEUBAT - Desarrollo (GNOME)" --id neubat-developer {
    set neubat_profile="developer"
    loopback loop ${iso_path}
    linux (loop)/arch/boot/x86_64/vmlinuz-linux \
