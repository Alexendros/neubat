        archisobasedir=arch ip=dhcp neubat_profile=${neubat_profile}
    initrd (loop)/arch/boot/x86_64/initramfs-linux.img
}

menuentry "NEUBAT - Minimo (sin GUI)" --id neubat-minimal {
    set neubat_profile="minimal"
