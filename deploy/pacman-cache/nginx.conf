# NEUBAT - Proxy caché de paquetes pacman (nginx)
# Acelera instalaciones repetidas en VMs/red local.
# Uso: docker run -d --name pacman-cache -p 8090:8090 \
#        -v pacman-cache:/cache -v $PWD/nginx-pacman-cache.conf:/etc/nginx/conf.d/default.conf:ro \
#        nginx:alpine
# En el cliente: Server = http://<host>:8090/$repo/os/$arch en mirrorlist

proxy_cache_path /cache/pacman levels=1:2 keys_zone=pacman:32m max_size=20g inactive=30d use_temp_path=off;

server {
    listen 8090;
    server_name _;

    # Las bases de datos de repo cambian: caché corta
    location ~* \.(db|files)(\.sig)?$ {
        rewrite ^/(.*)$ /mirror/archlinux/$1 break;
        proxy_pass https://ftp.rediris.es;
        proxy_ssl_server_name on;
        proxy_set_header Host ftp.rediris.es;
        proxy_cache pacman;
        proxy_cache_key $uri;
        proxy_cache_valid 200 5m;
        add_header X-Cache $upstream_cache_status;
    }

    # Los paquetes son inmutables por versión: caché larga
    location / {
        rewrite ^/(.*)$ /mirror/archlinux/$1 break;
        proxy_pass https://ftp.rediris.es;
        proxy_ssl_server_name on;
        proxy_set_header Host ftp.rediris.es;
        proxy_cache pacman;
        proxy_cache_key $uri;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_buffering on;
        proxy_max_temp_file_size 2048m;
        add_header X-Cache $upstream_cache_status;
    }
}
