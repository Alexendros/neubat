name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            portal/frontend/package-lock.json

      - name: Install portal dependencies
        run: cd portal && npm ci

      - name: Install frontend dependencies
        run: cd portal/frontend && npm ci

      - name: Install shellcheck and Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ansible
          pip3 install ansible-lint --break-system-packages || pip3 install ansible-lint

      - name: Validate scripts and configs
        run: make validate

      - name: Lint shell and frontend
        run: make lint

      - name: Validate Ansible
        run: make test-ansible

  test:
    name: test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            portal/package-lock.json
            portal/frontend/package-lock.json

      - name: Install portal dependencies
        run: cd portal && npm ci

      - name: Install frontend dependencies
        run: cd portal/frontend && npm ci

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run portal tests
        run: make test

      - name: Run frontend tests
        run: cd portal/frontend && npm test

      - name: Run bats tests
        run: make test-bash

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd portal/frontend && npm ci

      - name: Build frontend for production
        run: make build-frontend

      - name: Upload frontend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neubat-frontend
          path: |
            portal/public/index.html
            portal/public/assets/
            portal/public/favicon.svg
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install portal dependencies
        run: cd portal && npm ci

      - name: API smoke (health + install)
        run: make smoke
