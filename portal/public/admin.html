<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEUBAT — Panel de administración</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2230; --accent: #4fc3f7; --accent2: #7c4dff;
    --text: #e6edf3; --muted: #8b98a9; --ok: #3fb950; --err: #f85149; --warn: #f0883e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
    min-height: 100vh; padding: 1rem;
  }
  header { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; max-width: 72rem; margin: 1rem auto 1.5rem; }
  header h1 { font-size: clamp(1.4rem, 4vw, 2rem); }
  header h1 a { color: var(--text); text-decoration: none; }
  header h1 span { color: var(--accent); }
  .toolbar { display: flex; gap: .75rem; flex-wrap: wrap; align-items: center; }
  input, select, button {
    padding: .55rem .75rem; border-radius: .5rem; border: 1px solid #344256;
    background: #111927; color: var(--text); font-size: .9rem;
  }
  button { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #04121f; border: none; font-weight: 600; cursor: pointer; }
  button.secondary { background: #263144; color: var(--text); }
  button.danger { background: var(--err); color: #fff; }
  main { max-width: 72rem; margin: 0 auto; }
  .card {
    background: var(--panel); border: 1px solid #2a3546; border-radius: .75rem;
    padding: 1rem; overflow-x: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: .82rem; min-width: 44rem; }
  th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid #2a3546; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  td code { font-family: ui-monospace, monospace; word-break: break-all; }
  .estado { font-family: ui-monotonic, monospace; font-weight: 600; }
  .estado.pending { color: var(--accent); }
  .estado.downloaded { color: var(--accent2); }
  .estado.completed { color: var(--ok); }
  .estado.failed { color: var(--err); }
  .actions { display: flex; gap: .4rem; flex-wrap: wrap; }
  .actions button { padding: .35rem .6rem; font-size: .75rem; }
  .msg { padding: .75rem; border-radius: .5rem; margin-bottom: 1rem; display: none; }
  .msg.visible { display: block; }
  .msg.ok { background: rgba(63,185,80,.15); color: var(--ok); }
  .msg.err { background: rgba(248,81,73,.15); color: var(--err); }
  .login { max-width: 24rem; margin: 4rem auto; }
  .login label { display: block; color: var(--muted); font-size: .85rem; margin: .75rem 0 .25rem; }
  .login input { width: 100%; }
  .login button { width: 100%; margin-top: 1rem; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; margin: 2rem 0 1rem; }
</style>
</head>
<body>
<header>
  <h1><a href="/">NEU<span>BAT</span></a> · Admin</h1>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar token/hostname">
    <select id="filter-status">
      <option value="">Todos los estados</option>
      <option value="pending">pending</option>
      <option value="downloaded">downloaded</option>
      <option value="completed">completed</option>
      <option value="failed">failed</option>
    </select>
    <button id="btn-refresh">Refrescar</button>
    <button id="btn-logout" class="secondary">Salir</button>
  </div>
</header>

<main>
  <section id="login" class="card login">
    <h2>Acceso al panel</h2>
    <label for="token">Admin token</label>
    <input id="token" type="password" placeholder="ADMIN_TOKEN">
    <button id="btn-login">Entrar</button>
  </section>

  <section id="panel" style="display:none">
    <div id="msg" class="msg"></div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Token</th>
            <th>Perfil</th>
            <th>Hostname</th>
            <th>Estado</th>
            <th>Creada</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla"><tr><td colspan="6">Cargando…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>

<footer>NEUBAT v1.0.0 · GPL-3.0</footer>

<script>
const $ = id => document.getElementById(id);
let adminToken = localStorage.getItem('neubat_admin_token') || '';

function showMsg(text, ok) {
  const el = $('msg');
  el.textContent = text;
  el.className = 'msg visible ' + (ok ? 'ok' : 'err');
  setTimeout(() => el.className = 'msg', 4000);
}

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Authorization': 'Bearer ' + adminToken, 'Content-Type': 'application/json' },
    ...opts
  });
  if (res.status === 401) {
    localStorage.removeItem('neubat_admin_token');
    $('panel').style.display = 'none';
    $('login').style.display = 'block';
    throw new Error('Sesión expirada o token inválido');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function render(list) {
  const term = $('search').value.toLowerCase();
  const statusFilter = $('filter-status').value;
  const filtered = list.filter(i => {
    const matches = (i.token + ' ' + (i.hostname || '') + ' ' + i.profile).toLowerCase().includes(term);
    return matches && (!statusFilter || i.status === statusFilter);
  });

  const tbody = $('tabla');
  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="6">Sin instalaciones coincidentes.</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map(i => `<tr>
    <td><code title="${i.token}">${i.token.slice(0, 10)}…</code></td>
    <td>${i.profile}</td>
    <td>${i.hostname || '-'}</td>
    <td class="estado ${i.status}">${i.status}</td>
    <td>${new Date(i.created_at).toLocaleString('es-ES')}</td>
    <td class="actions">
      <button onclick="resetInstall('${i.token}')">Reset</button>
      <button class="secondary" onclick="markComplete('${i.token}')">Completar</button>
      <button class="danger" onclick="deleteInstall('${i.token}')">Eliminar</button>
    </td>
  </tr>`).join('');
}

let currentList = [];

async function load() {
  try {
    currentList = await api('/api/admin/installations');
    render(currentList);
  } catch (e) {
    $('tabla').innerHTML = `<tr><td colspan="6" class="estado failed">${e.message}</td></tr>`;
  }
}

window.resetInstall = async token => {
  try {
    await api('/api/admin/installations/' + token + '/reset', { method: 'POST' });
    showMsg('Instalación reseteada', true); load();
  } catch (e) { showMsg(e.message, false); }
};
window.markComplete = async token => {
  try {
    await api('/api/admin/installations/' + token + '/status', {
      method: 'POST', body: JSON.stringify({ status: 'completed' })
    });
    showMsg('Estado actualizado', true); load();
  } catch (e) { showMsg(e.message, false); }
};
window.deleteInstall = async token => {
  if (!confirm('¿Eliminar definitivamente esta instalación?')) return;
  try {
    await api('/api/admin/installations/' + token, { method: 'DELETE' });
    showMsg('Instalación eliminada', true); load();
  } catch (e) { showMsg(e.message, false); }
};

$('btn-login').addEventListener('click', () => {
  adminToken = $('token').value.trim();
  if (!adminToken) return;
  localStorage.setItem('neubat_admin_token', adminToken);
  $('login').style.display = 'none';
  $('panel').style.display = 'block';
  load();
});

$('btn-logout').addEventListener('click', () => {
  adminToken = '';
  localStorage.removeItem('neubat_admin_token');
  $('panel').style.display = 'none';
  $('login').style.display = 'block';
});

$('btn-refresh').addEventListener('click', load);
$('search').addEventListener('input', () => render(currentList));
$('filter-status').addEventListener('change', () => render(currentList));

if (adminToken) {
  $('login').style.display = 'none';
  $('panel').style.display = 'block';
  load();
}
</script>
</body>
</html>
